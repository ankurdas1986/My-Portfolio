<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Professional Background -->
  <circle cx="160" cy="160" r="160" fill="url(#bg)"/>
  
  <!-- Background blur effects -->
  <circle cx="220" cy="100" r="40" fill="#3b82f6" opacity="0.1"/>
  <circle cx="100" cy="80" r="30" fill="#2563eb" opacity="0.1"/>
  <circle cx="280" cy="200" r="35" fill="#1d4ed8" opacity="0.1"/>
  
  <!-- Professional lighting -->
  <ellipse cx="160" cy="160" rx="140" ry="150" fill="#ffffff" opacity="0.3"/>
  
  <!-- Shoulders/Suit jacket -->
  <path d="M80 200 Q80 180 100 180 L220 180 Q240 180 240 200 L250 320 L70 320 Z" fill="url(#suit)"/>
  
  <!-- Shirt -->
  <path d="M110 200 Q110 185 125 185 L195 185 Q210 185 210 200 L210 320 L110 320 Z" fill="#ffffff"/>
  
  <!-- Tie -->
  <path d="M150 200 L170 200 Q165 240 165 280 Q160 285 155 280 Q155 240 150 200" fill="#2563eb"/>
  
  <!-- Suit lapels -->
  <path d="M110 200 L130 220 L115 250" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <path d="M210 200 L190 220 L205 250" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Face -->
  <circle cx="160" cy="130" r="50" fill="url(#face)"/>
  
  <!-- Hair -->
  <path d="M110 130 Q110 90 160 85 Q210 90 210 130 Q205 95 160 95 Q115 95 110 130" fill="#1f2937"/>
  
  <!-- Hair details -->
  <path d="M130 95 Q140 90 150 95" fill="none" stroke="#374151" stroke-width="1.5"/>
  <path d="M170 95 Q180 90 190 95" fill="none" stroke="#374151" stroke-width="1.5"/>
  
  <!-- Glasses frame -->
  <circle cx="145" cy="125" r="18" fill="none" stroke="#374151" stroke-width="3"/>
  <circle cx="175" cy="125" r="18" fill="none" stroke="#374151" stroke-width="3"/>
  <line x1="163" y1="125" x2="157" y2="125" stroke="#374151" stroke-width="3"/>
  
  <!-- Glasses temple arms -->
  <path d="M127 125 Q120 120 115 125" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M193 125 Q200 120 205 125" fill="none" stroke="#374151" stroke-width="2.5"/>
  
  <!-- Glasses lenses (subtle reflection) -->
  <circle cx="145" cy="125" r="16" fill="#f8fafc" opacity="0.4"/>
  <circle cx="175" cy="125" r="16" fill="#f8fafc" opacity="0.4"/>
  
  <!-- Lens reflections -->
  <ellipse cx="140" cy="120" rx="8" ry="12" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="170" cy="120" rx="8" ry="12" fill="#ffffff" opacity="0.6"/>
  
  <!-- Eyes behind glasses -->
  <circle cx="145" cy="125" r="3" fill="#1f2937"/>
  <circle cx="175" cy="125" r="3" fill="#1f2937"/>
  <circle cx="146" cy="124" r="1" fill="#ffffff"/>
  <circle cx="176" cy="124" r="1" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M135 115 Q145 110 155 115" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <path d="M165 115 Q175 110 185 115" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M160 135 Q158 140 160 145" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Professional smile -->
  <path d="M150 150 Q160 158 170 150" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Facial shading -->
  <ellipse cx="130" cy="135" rx="8" ry="15" fill="#f59e0b" opacity="0.3"/>
  <ellipse cx="190" cy="135" rx="8" ry="15" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Professional lighting on face -->
  <ellipse cx="140" cy="110" rx="20" ry="30" fill="#ffffff" opacity="0.4"/>
  
  <!-- Shirt collar -->
  <path d="M125 185 Q160 190 195 185" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Professional shadow -->
  <ellipse cx="160" cy="300" rx="60" ry="8" fill="#1e293b" opacity="0.15"/>
  
  <!-- Additional professional background elements -->
  <circle cx="50" cy="150" r="20" fill="#3b82f6" opacity="0.08"/>
  <circle cx="270" cy="120" r="25" fill="#1d4ed8" opacity="0.08"/>
  
  <!-- Name badge area (subtle) -->
  <rect x="120" y="285" width="80" height="15" rx="7" fill="#1e293b" opacity="0.1"/>
  <text x="160" y="295" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif" font-size="8" font-weight="600">ANKUR DAS</text>
</svg>